
services:
  - type: web
    name: petopia
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter   # Change to free or paid as needed
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Europe/Moscow
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: petopia-db
    plan: free
    databaseName: petopia
    user: petopia

